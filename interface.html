<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tata Nexon RAG Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .status {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            font-size: 12px;
            background: #f5f5f5;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
        }

        .documents-info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px 16px;
            margin: 15px 0;
            border-radius: 4px;
            font-size: 13px;
        }

        .documents-info strong {
            color: #1976d2;
        }

        .doc-list {
            margin-top: 8px;
            padding-left: 20px;
        }

        .doc-item {
            margin: 4px 0;
            color: #0d47a1;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 20px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message.bot {
            text-align: left;
        }

        .message-content {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 2px;
        }

        .sources {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            max-width: 70%;
        }

        .source-item {
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 5px;
            display: inline-block;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="number"] {
            width: 80px;
            padding: 12px 8px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #c62828;
            font-size: 14px;
        }

        .error strong {
            display: block;
            margin-bottom: 8px;
        }

        .error .retry-btn {
            background: #c62828;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 12px;
        }

        .error .retry-btn:hover {
            background: #b71c1c;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .suggestion-btn {
            background: white;
            color: #667eea;
            border: 1px solid #667eea;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: all 0.3s;
        }

        .suggestion-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🚗 Tata Nexon RAG Assistant</h1>
            <p>Ask anything about your vehicle's manual</p>
        </div>

        <!-- Status -->
        <div class="status">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>API: Connected</span>
            </div>
            <div class="status-item">
                <div class="status-dot"></div>
                <span>Vector Store: Ready (5648 chunks)</span>
            </div>
            <div class="status-item">
                <div class="status-dot"></div>
                <span>LLM: google/gemma-3-12b-it:free</span>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <h3>Welcome to Tata Nexon Assistant</h3>
                <p>Ask any question about your vehicle's features, maintenance, and more.</p>
                
                <div id="docsInfo"></div>
                
                <div class="suggestions">
                    <button class="suggestion-btn" onclick="setQuestion('What does the TPMS warning light mean?')">
                        What does TPMS mean?
                    </button>
                    <button class="suggestion-btn" onclick="setQuestion('How to use the scissor jack?')">
                        How to use scissor jack?
                    </button>
                    <button class="suggestion-btn" onclick="setQuestion('What engine oil grade is recommended?')">
                        What engine oil?
                    </button>
                    <button class="suggestion-btn" onclick="setQuestion('Explain the dashboard warning lights')">
                        Dashboard lights
                    </button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Ask me anything about your Tata Nexon..." 
                    onkeypress="if(event.key === 'Enter') sendQuery()"
                >
                <input 
                    type="number" 
                    id="topK" 
                    value="5" 
                    min="1" 
                    max="10" 
                    title="Number of sources to retrieve"
                >
                <button onclick="sendQuery()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const questionInput = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        const topKInput = document.getElementById('topK');

        function resolveApiBaseUrl() {
            const { origin, protocol, hostname, port } = window.location;
            const githubForwardedHost = hostname.match(/^(.*)-(\d+)\.app\.github\.dev$/);

            if (githubForwardedHost) {
                if (githubForwardedHost[2] === '8000') {
                    return origin;
                }
                return `${protocol}//${githubForwardedHost[1]}-8000.app.github.dev`;
            }

            if (port === '8000') {
                return origin;
            }

            return `${protocol}//${hostname}:8000`;
        }

        const API_BASE_URL = resolveApiBaseUrl();

        let isFirstMessage = true;

        function setQuestion(question) {
            questionInput.value = question;
            questionInput.focus();
        }

        async function sendQuery() {
            const question = questionInput.value.trim();
            if (!question) return;

            // Clear empty state
            if (isFirstMessage) {
                chatArea.innerHTML = '';
                isFirstMessage = false;
            }

            // Add user message
            addMessage(question, 'user');
            questionInput.value = '';
            sendBtn.disabled = true;

            // Add loading message
            const loadingId = addMessage(
                '<div class="loading"><div class="spinner"></div><span>Thinking...</span></div>',
                'bot',
                true
            );

            try {
                const topK = parseInt(topKInput.value) || 5;
                const response = await fetch(`${API_BASE_URL}/query`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        top_k: topK
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Remove loading message
                const loadingMsg = document.getElementById(loadingId);
                if (loadingMsg) loadingMsg.remove();

                // Add bot response
                let html = `<div class="message-content">${escapeHtml(data.answer)}</div>`;
                
                // Add sources
                if (data.sources && data.sources.length > 0) {
                    html += '<div class="sources"><strong>Sources:</strong>';
                    data.sources.forEach((source, index) => {
                        html += `<div class="source-item">
                            📄 ${source.filename} (Page ${source.page_number}) 
                            <br><small>Similarity: ${(source.similarity * 100).toFixed(1)}%</small>
                        </div>`;
                    });
                    html += '</div>';
                }

                const msgDiv = document.createElement('div');
                msgDiv.className = 'message bot';
                msgDiv.innerHTML = html;
                chatArea.appendChild(msgDiv);
                chatArea.scrollTop = chatArea.scrollHeight;

            } catch (error) {
                console.error('Error:', error);

                // Remove loading message
                const loadingMsg = document.getElementById(loadingId);
                if (loadingMsg) loadingMsg.remove();

                addErrorMessage(error.message);
            } finally {
                sendBtn.disabled = false;
                questionInput.focus();
            }
        }

        function addErrorMessage(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'message bot';
            errorDiv.innerHTML = `
                <div class="message-content error">
                    <strong>Unable to reach the server.</strong>
                    <div>Check that the API is running at ${API_BASE_URL}.</div>
                    <small>${escapeHtml(message)}</small>
                    <div><button class="retry-btn" type="button">Retry Connection</button></div>
                </div>
            `;

            const retryButton = errorDiv.querySelector('.retry-btn');
            retryButton.addEventListener('click', retryConnection);

            chatArea.appendChild(errorDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function retryConnection() {
            try {
                const authenticatedResponse = await fetch(`${API_BASE_URL}/health`, {
                    credentials: 'include'
                });
                if (!authenticatedResponse.ok) {
                    throw new Error(`HTTP error! status: ${authenticatedResponse.status}`);
                }

                await fetchSystemStatus();
                alert('Server connection restored. You can try your query again.');
            } catch (error) {
                alert('Still unable to connect to the API server.');
            }
        }

        function addMessage(text, type, isHtml = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            const id = `msg-${Date.now()}-${Math.random()}`;
            msgDiv.id = id;

            if (isHtml) {
                msgDiv.innerHTML = text;
            } else {
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = text;
                msgDiv.appendChild(contentDiv);
            }

            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Focus input on load
        window.addEventListener('load', () => {
            questionInput.focus();
            fetchSystemStatus();
        });

        async function fetchSystemStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`, {
                    credentials: 'include'
                });
                if (response.ok) {
                    const data = await response.json();
                    displayDocuments(data.chunks_indexed);
                    updateStatus(true, data.chunks_indexed, data.model_llm);
                } else {
                    updateStatus(false, null, null);
                }
            } catch (error) {
                console.error('Could not fetch system status:', error);
                displayDocuments(null);
                updateStatus(false, null, null);
            }
        }

        function updateStatus(isConnected, chunksCount, llmModel) {
            const statusItems = document.querySelectorAll('.status-item span');
            const statusDots = document.querySelectorAll('.status-dot');

            if (statusItems.length < 3 || statusDots.length < 3) {
                return;
            }

            statusItems[0].textContent = `API: ${isConnected ? 'Connected' : 'Disconnected'}`;
            statusItems[1].textContent = `Vector Store: ${chunksCount !== null ? `Ready (${chunksCount} chunks)` : 'Unavailable'}`;
            statusItems[2].textContent = `LLM: ${llmModel || 'Unavailable'}`;

            statusDots.forEach((dot) => {
                dot.style.background = isConnected ? '#4caf50' : '#c62828';
            });
        }

        function displayDocuments(chunksCount) {
            const docsInfo = document.getElementById('docsInfo');
            if (docsInfo) {
                let html = `
                    <div class="documents-info">
                        <strong>📚 Available Documents (Auto-loaded):</strong>
                        <div class="doc-list">
                            <div class="doc-item">✓ nexon-2025-owners-manual.pdf</div>
                        </div>
                        <strong style="margin-top: 8px; display: block;">📊 System Status:</strong>
                        <div class="doc-list">
                            <div class="doc-item">✓ Indexed chunks: ${chunksCount || 'Loading...'}</div>
                            <div class="doc-item">✓ No upload needed - documents are pre-indexed</div>
                            <div class="doc-item">✓ Ready to answer questions</div>
                        </div>
                    </div>
                `;
                docsInfo.innerHTML = html;
            }
        }
    </script>
</body>
</html>
